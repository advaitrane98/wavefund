[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
cache_path = "cache"

solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

remappings = [
  "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "permit2/=lib/permit2/",
  "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
  "forge-std/=lib/v4-periphery/lib/v4-core/lib/forge-std/src/",
  "ds-test/=lib/v4-periphery/lib/v4-core/lib/forge-std/lib/ds-test/src/",
]

# deployments/ holds per-network address books written by scripts.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32

# Arc Testnet: chain id 5042002. Set ARC_TESTNET_RPC in .env.
[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC}"
